server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    # 默认使用嵌入式 SQLite（无需外部数据库）；.env 中配置 DB_URL/DB_DRIVER/DB_USER/DB_PASSWORD 可切换 MySQL：
    #   DB_DRIVER=com.mysql.cj.jdbc.Driver
    #   DB_URL=jdbc:mysql://192.168.1.200:3308/fvd?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    #   DB_USER=root
    #   DB_PASSWORD=xxx
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    url: ${DB_URL:jdbc:sqlite:data/fvd.db}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      # SQLite 为单写文件库，连接池保持 1 即可；切换 MySQL 时可在 .env 调大（如 DB_POOL_MAX=16）
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 10000   # 10s 拿不到连接快速失败，避免请求长时间挂起
      initialization-fail-timeout: -1   # 启动时若 DB 不可达不阻塞应用启动，首次取连接时才失败
      # 局域网 MySQL/NAT 可能静默回收空闲 TCP 连接：主动保活 + 限制连接寿命，避免借到已关闭的连接
      idle-timeout: 600000        # 空闲 10 分钟后回收
      max-lifetime: 1200000       # 连接最长存活 20 分钟（须小于 MySQL wait_timeout）
      keepalive-time: 300000      # 每 5 分钟对空闲连接做一次保活探测
  flyway:
    # 统一用 Flyway 管理建表/迁移：SQLite 走 db/migration/sqlite，MySQL 走 db/migration/mysql（由启动类按 DB_URL 切换）
    enabled: true
    baseline-on-migrate: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/sqlite}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cc.ivera.auth.domain,cc.ivera.cookie.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  # yt-dlp 可执行文件路径（默认取 PATH 中的 yt-dlp）
  ytdlp-path: ${YTDLP_PATH:D:\develop\yt-dlp.exe}
  # ffmpeg 目录或可执行文件路径（音视频合并需要），留空则不传该参数
  ffmpeg-location: ${FFMPEG_LOCATION:D:\develop\ffmpeg\bin}
   # JS 运行时（deno.exe 路径或所在目录）：YouTube 反爬需要它解 BotGuard 挑战并生成 PO token
  js-runtime-path: ${JS_RUNTIME_PATH:D:\develop\deno\deno.exe}
  # aria2c 多连接下载器（exe 路径或目录）：配置后服务端下载自动走 16 连接分片加速
  aria2c-path: ${ARIA2C_PATH:}
  aria2c-connections: ${ARIA2C_CONNECTIONS:16}
  # 出站代理（访问 YouTube/Twitter 等被墙平台时配置，如 http://127.0.0.1:7890），留空直连
  proxy: ${PROXY_URL:}
  # YouTube 公共镜像实例（Invidious，逗号分隔）：出口 IP 被风控时兜底解析元数据/字幕，留空用内置默认
  youtube-mirror-apis: ${YOUTUBE_MIRROR_APIS:}
  # 临时下载目录：下载时创建的临时文件夹根目录（每次下载生成 UUID 子目录，完成后自动清理）。
  # 支持相对路径和绝对路径：相对路径（默认 downloads）以应用启动时的工作目录为基准
  # （IDE/命令行运行即 backend/ 目录，java -jar 运行即执行命令所在目录）；
  # 绝对路径示例：D:\data\clipfetch-downloads 或 /var/tmp/clipfetch-downloads
  downloads-dir: ${DOWNLOADS_DIR:downloads}
  # 解析超时（秒）
  parse-timeout: ${PARSE_TIMEOUT:60}
  # CCTV h5e 解密 sidecar 最长等待时间（毫秒）——Node 批量解密速度约 20x，45 分钟视频约 3 分钟，默认 10 分钟足够
  cctv-decrypt-timeout-ms: ${CCTV_DECRYPT_TIMEOUT_MS:600000}
  # Node.js 可执行文件路径
  node-exe: ${NODE_EXE:node}
  # CCTV Node 批量解密脚本路径（默认自动查找 src/main/resources/cctv/decrypt_browser.js）
  cctv-decrypt-script: ${CCTV_DECRYPT_SCRIPT:}
  # Python 可执行文件（QQ 音乐取流 sidecar 用）
  python-exe: ${PYTHON_EXE:python}
  # QQ 音乐浏览器取流 sidecar（Python + Playwright + 系统 Chrome，需 pip install playwright）
  qqmusic-sidecar:
    enabled: ${QQMUSIC_SIDECAR_ENABLED:true}
    port: ${QQMUSIC_SIDECAR_PORT:8095}
    # Chrome 持久化用户目录（保存扫码登录态），相对路径以应用工作目录为基准
    profile-dir: ${QQMUSIC_PROFILE_DIR:qqmusic-profile}
    # sidecar 脚本路径（默认自动查找 src/main/resources/qqmusic/qqmusic_sidecar.py）
    script: ${QQMUSIC_SIDECAR_SCRIPT:}
  # 酷狗音乐浏览器取流 sidecar（play/songinfo 需页面 H5 签名 + 登录态，匿名一律 30020）
  kugou-sidecar:
    enabled: ${KUGOU_SIDECAR_ENABLED:true}
    port: ${KUGOU_SIDECAR_PORT:8096}
    # Chrome 持久化用户目录（保存扫码登录态），相对路径以应用工作目录为基准
    profile-dir: ${KUGOU_PROFILE_DIR:kugou-profile}
    # sidecar 脚本路径（默认自动查找 src/main/resources/kugou/kugou_sidecar.py）
    script: ${KUGOU_SIDECAR_SCRIPT:}
  # 腾讯视频浏览器取流 sidecar（getinfo 接口需登录态 cookie，VIP 内容匿名只能试看）
  tencent-sidecar:
    enabled: ${TENCENT_SIDECAR_ENABLED:true}
    port: ${TENCENT_SIDECAR_PORT:8097}
    # Chrome 持久化用户目录（保存扫码登录态），相对路径以应用工作目录为基准
    profile-dir: ${TENCENT_PROFILE_DIR:tencent-profile}
    # sidecar 脚本路径（默认自动查找 src/main/resources/tencent/tencent_sidecar.py）
    script: ${TENCENT_SIDECAR_SCRIPT:}
  # SpankBang 浏览器取流 sidecar：CF Bot Management 绑定真实 Chrome TLS 指纹，
  # yt-dlp 无法过页面验证，用真实 Chrome 提取 stream_data 各档 CDN 直链
  spankbang-sidecar:
    enabled: ${SPANKBANG_SIDECAR_ENABLED:true}
    port: ${SPANKBANG_SIDECAR_PORT:8098}
    profile-dir: ${SPANKBANG_PROFILE_DIR:spankbang-profile}
    script: ${SPANKBANG_SIDECAR_SCRIPT:}
  # 字幕转换服务（RAG API）：本系统仅做登录态网关，不在本地落字幕数据；
  # 用户在页面上用自己的第三方账号连接（令牌存 third_party_session 表，账号密码不落库）
  subtitle:
    api-base-url: ${SUBTITLE_API_BASE_URL:http://localhost:8080}
  # 磁力下载（qBittorrent Web API）：连接参数与保存路径统一从 backend/.env 读取
  magnet:
    # qBittorrent Web UI 地址（需在 qBittorrent 选项中启用 Web UI），端口注意避开 8082（后端）与 8080（字幕 RAG）
    qbt-host: ${qbt-host:}
    qbt-user: ${qbt-user:admin}
    qbt-pass: ${qbt-pass:}
    # 保存路径：必须是 qBittorrent 进程可见的路径；qBittorrent 跑在 Docker 中时必须填容器内部路径；留空用 qBittorrent 默认目录
    qbt-savepath: ${QBT_SAVEPATH:}
    # qBittorrent 保存路径在宿主机上的对应目录（后端从此目录读取文件供浏览器下载）；
    # 示例：D:/BaiduNetdiskDownload
    qbt-downloads-host-dir: ${QBT_DOWNLOADS_HOST_DIR:}
    # Windows 或 Linux 均可用的独立 HTTP 文件网关（默认拒绝 HTTP，需显式允许）。
    file-gateway-url: ${QBT_FILE_GATEWAY_URL:}
    file-gateway-secret: ${QBT_FILE_GATEWAY_SECRET:}
    # 仅用于本机集成测试，生产环境一律 false。
    file-gateway-allow-http: ${QBT_FILE_GATEWAY_ALLOW_HTTP:false}
    # 元数据获取超时（秒）
    metadata-timeout: ${metadata-timeout:60}
    # 自研 BT 协议引擎：P0/P1 只有协议校验与数据结构，尚不允许创建真实下载任务。
    native-engine:
      enabled: ${TORRENT_NATIVE_ENABLED:false}
      storage-root: ${TORRENT_NATIVE_STORAGE_ROOT:downloads/torrent-native}
      # 允许用户挑选为下载根的服务器目录白名单（英文逗号分隔的绝对路径）；留空则仅允许 storage-root。
      download-root-bases: ${TORRENT_NATIVE_DOWNLOAD_ROOT_BASES:}
      max-metadata-bytes: ${TORRENT_NATIVE_MAX_METADATA_BYTES:8388608}
      max-active-tasks-per-user: ${TORRENT_NATIVE_MAX_ACTIVE_TASKS_PER_USER:3}
      max-peers-per-task: ${TORRENT_NATIVE_MAX_PEERS_PER_TASK:20}
      max-peers-global: ${TORRENT_NATIVE_MAX_PEERS_GLOBAL:400}
      # 只启用有登录认证的内存 Metadata 查询，不会启动 Native Piece 下载；默认关闭。
      metadata-lookup-enabled: ${TORRENT_NATIVE_METADATA_LOOKUP_ENABLED:false}
      # 仅 P4 控制面（查询/准备/暂停/逻辑删除），不启动真实下载。
      task-control-enabled: ${TORRENT_NATIVE_TASK_CONTROL_ENABLED:false}
      task-creation-enabled: ${TORRENT_NATIVE_TASK_CREATION_ENABLED:false}
      # 受控单轮 Worker，默认关闭，无后台自动启动与 HTTP 公开入口。
      worker-round-enabled: ${TORRENT_NATIVE_WORKER_ROUND_ENABLED:false}
      # 仅经过验证的公开种子，Tracker 无可用 Peer 时 DHT 兜底，默认关闭。
      dht-fallback-enabled: ${TORRENT_NATIVE_DHT_FALLBACK_ENABLED:false}
      # 内部异步 Piece Worker，必须同时启用 native/round/async 三项开关
      async-worker-enabled: ${TORRENT_NATIVE_ASYNC_WORKER_ENABLED:false}
      continuous-worker-enabled: ${TORRENT_NATIVE_CONTINUOUS_WORKER_ENABLED:false}
      continuous-max-pieces: ${TORRENT_NATIVE_CONTINUOUS_MAX_PIECES:256}
      continuous-max-rounds: ${TORRENT_NATIVE_CONTINUOUS_MAX_ROUNDS:10000}
      continuous-max-seconds: ${TORRENT_NATIVE_CONTINUOUS_MAX_SECONDS:86400}
      continuous-stalled-rounds: ${TORRENT_NATIVE_CONTINUOUS_STALLED_ROUNDS:10}
      parallel-piece-enabled: ${TORRENT_NATIVE_PARALLEL_PIECE_ENABLED:false}
      parallel-piece-workers: ${TORRENT_NATIVE_PARALLEL_PIECE_WORKERS:256}
      commit-group-pieces: ${TORRENT_NATIVE_COMMIT_GROUP_PIECES:256}
      # Rarest-First 仅按经过身份校验的 BEP3 完整 Bitfield 统计
      rarest-first-enabled: ${TORRENT_NATIVE_RAREST_FIRST_ENABLED:false}
      # 每个有限 Piece 轮次内按 Peer 复用 TCP，默认关闭
      peer-connection-reuse-enabled: ${TORRENT_NATIVE_PEER_CONNECTION_REUSE_ENABLED:false}
      peer-handshake-timeout-millis: ${TORRENT_NATIVE_PEER_HANDSHAKE_TIMEOUT_MILLIS:2000}
      peer-stall-timeout-millis: ${TORRENT_NATIVE_PEER_STALL_TIMEOUT_MILLIS:8000}
      peer-connect-timeout-millis: ${TORRENT_NATIVE_PEER_CONNECT_TIMEOUT_MILLIS:1500}
      peer-max-in-flight-blocks: ${TORRENT_NATIVE_PEER_MAX_IN_FLIGHT_BLOCKS:64}
      peer-failure-backoff-max-millis: ${TORRENT_NATIVE_PEER_FAILURE_BACKOFF_MAX_MILLIS:30000}
      # P4: opt-in inbound TCP. No OS firewall / NAT changes.
      multiplexed-peer-mailbox-enabled: ${TORRENT_NATIVE_MULTIPLEXED_PEER_MAILBOX_ENABLED:false}
      inbound-tcp-enabled: ${TORRENT_NATIVE_INBOUND_TCP_ENABLED:false}
      inbound-public-exposure-enabled: ${TORRENT_NATIVE_INBOUND_PUBLIC_EXPOSURE_ENABLED:false}
      inbound-bind-host: ${TORRENT_NATIVE_INBOUND_BIND_HOST:127.0.0.1}
      inbound-listen-port: ${TORRENT_NATIVE_INBOUND_LISTEN_PORT:6889}
      network-round-budget-millis: ${TORRENT_NATIVE_NETWORK_ROUND_BUDGET_MILLIS:180000}
      bitfield-probe-peers: ${TORRENT_NATIVE_BITFIELD_PROBE_PEERS:4}
      bitfield-probe-timeout-millis: ${TORRENT_NATIVE_BITFIELD_PROBE_TIMEOUT_MILLIS:600}
      async-worker-threads: ${TORRENT_NATIVE_ASYNC_WORKER_THREADS:2}
      async-worker-queue-size: ${TORRENT_NATIVE_ASYNC_WORKER_QUEUE_SIZE:8}
      async-worker-per-user-limit: ${TORRENT_NATIVE_ASYNC_WORKER_PER_USER_LIMIT:2}
      single-instance-orphan-recovery-enabled: ${TORRENT_NATIVE_SINGLE_INSTANCE_ORPHAN_RECOVERY_ENABLED:false}
      startup-retry-lease-audit-enabled: ${TORRENT_NATIVE_STARTUP_RETRY_LEASE_AUDIT_ENABLED:false}
      instance-heartbeat-enabled: ${TORRENT_NATIVE_INSTANCE_HEARTBEAT_ENABLED:false}
      legacy-worker-compatibility-enabled: ${TORRENT_NATIVE_LEGACY_WORKER_COMPATIBILITY_ENABLED:false}
      metadata-concurrent-jobs: ${TORRENT_NATIVE_METADATA_CONCURRENT_JOBS:2}
      metadata-queued-jobs: ${TORRENT_NATIVE_METADATA_QUEUED_JOBS:8}
      metadata-max-pending-per-user: ${TORRENT_NATIVE_METADATA_MAX_PENDING_PER_USER:2}
      metadata-total-timeout-seconds: ${TORRENT_NATIVE_METADATA_TOTAL_TIMEOUT_SECONDS:90}
      metadata-listen-port: ${TORRENT_NATIVE_METADATA_LISTEN_PORT:6881}
      # 单个 Magnet 解析任务最多尝试多少个 Peer 拉取 BEP9 info 字典
      metadata-peer-attempts: ${TORRENT_NATIVE_METADATA_PEER_ATTEMPTS:32}
      # 单个 Peer 的 ut_metadata 交换超时（毫秒）
      metadata-peer-timeout-millis: ${TORRENT_NATIVE_METADATA_PEER_TIMEOUT_MILLIS:8000}
  jwt:
    # 生产环境务必在 .env 中改为随机长字符串
    secret: ${JWT_SECRET:8fK2vQ9mL4xD7sR1tY6pH3jN5wZ0bC8aE2gU7kP4}
    access-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
    refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
logging:
  level:
    cc.ivera: INFO
  # 日志目录：.env 中 LOGS_DIR 可覆盖（相对路径以启动目录为基准）
  file:
    path: ${LOGS_DIR:logs}

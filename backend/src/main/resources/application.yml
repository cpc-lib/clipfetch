server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.1.200}:${DB_PORT:3308}/${DB_NAME:fvd}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=60000
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:cpc!23#@}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
      initialization-fail-timeout: -1   # 启动时若 DB 不可达不阻塞应用启动，首次取连接时才失败
      # 局域网 MySQL/NAT 可能静默回收空闲 TCP 连接：主动保活 + 限制连接寿命，避免借到已关闭的连接
      idle-timeout: 600000        # 空闲 10 分钟后回收
      max-lifetime: 1200000       # 连接最长存活 20 分钟（须小于 MySQL wait_timeout）
      keepalive-time: 300000      # 每 5 分钟对空闲连接做一次保活探测
  jpa:
    hibernate:
      ddl-auto: none   # 启动时不执行 DDL，DB 不可达时应用仍可启动；表结构由部署时维护
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # 启动时不查询 JDBC 元数据，避免 DB 不可达时 Hibernate 初始化阻塞
        temp:
          use_jdbc_metadata_defaults: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 2MB

app:
  # yt-dlp 可执行文件路径（默认取 PATH 中的 yt-dlp）
  ytdlp-path: ${YTDLP_PATH:D:\develop\yt-dlp.exe}
  # ffmpeg 目录或可执行文件路径（音视频合并需要），留空则不传该参数
  ffmpeg-location: ${FFMPEG_LOCATION:D:\develop\ffmpeg\bin}
  # 出站代理（访问 YouTube/Twitter 等被墙平台时配置，如 http://127.0.0.1:7890），留空直连
  proxy: ${PROXY_URL:}
  # JS 运行时（deno.exe 路径或所在目录）：YouTube 反爬需要它解 BotGuard 挑战并生成 PO token
  js-runtime-path: ${JS_RUNTIME_PATH:}
  # aria2c 多连接下载器（exe 路径或目录）：配置后服务端下载自动走 16 连接分片加速
  aria2c-path: ${ARIA2C_PATH:}
  aria2c-connections: ${ARIA2C_CONNECTIONS:16}
  # 临时下载目录
  downloads-dir: ${DOWNLOADS_DIR:downloads}
  # 解析超时（秒）
  parse-timeout: ${PARSE_TIMEOUT:60}
  # CCTV h5e 解密 sidecar 最长等待时间（毫秒）——Node 批量解密速度约 20x，45 分钟视频约 3 分钟，默认 10 分钟足够
  cctv-decrypt-timeout-ms: ${CCTV_DECRYPT_TIMEOUT_MS:600000}
  # Node.js 可执行文件路径
  node-exe: ${NODE_EXE:node}
  # CCTV Node 批量解密脚本路径（默认自动查找 src/main/resources/cctv/decrypt_browser.js）
  cctv-decrypt-script: ${CCTV_DECRYPT_SCRIPT:}
  jwt:
    # 生产环境务必在 .env 中改为随机长字符串
    secret: ${JWT_SECRET:fvd-dev-secret-change-me-in-production-0123456789abcdef}
    access-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
    refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  ai:
    # OpenAI 兼容接口（通义千问 Qwen 使用百炼兼容端点）
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen-plus}
    # 免费用户每日 AI 总结/问答总次数
    free-daily-quota: ${AI_FREE_DAILY_QUOTA:3}

logging:
  level:
    com.fvd: INFO

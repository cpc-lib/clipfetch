# ClipFetch file gateway - qBittorrent Linux host (traditional source-built Nginx).
# Install to: /usr/local/nginx/conf/conf.d/clipfetch-file-gateway.conf
# Include the directory INSIDE http{} of /usr/local/nginx/conf/nginx.conf:
#     include /usr/local/nginx/conf/conf.d/*.conf;
#
# Python systemd service: 127.0.0.1:18766
# Public HTTP Nginx entry: 18767 (allow ONLY Spring Boot egress IP; HTTP is unencrypted).
server {
    listen 18767;
    server_name _;
    server_tokens off;
    access_log off;

    # FAIL CLOSED by default. BEFORE deployment add an allow line for your
    # actual Spring Boot SERVER OUTBOUND IP, above "deny all":
    # allow 203.0.113.25; # EXAMPLE ONLY; never use placeholder in production
    allow 127.0.0.1;
    deny all;

    location = /internal/files {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header X-Clipfetch-Time $http_x_clipfetch_time;
        proxy_set_header X-Clipfetch-Signature $http_x_clipfetch_signature;
        proxy_set_header Accept-Encoding identity;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    location / {
        return 404;
    }
}

# Copy to /etc/clipfetch-file-gateway.conf and chmod 600 (root-owned).
# QBT_FILE_ROOT = REAL Linux HOST download directory (not a Docker-internal path).
# Python should listen on loopback; Nginx handles external HTTP access on :18767.
QBT_FILE_ROOT=/srv/qbittorrent/downloads
QBT_FILE_GATEWAY_BIND=127.0.0.1
QBT_FILE_GATEWAY_PORT=18766
QBT_FILE_GATEWAY_ALLOW_REMOTE=false
QBT_FILE_GATEWAY_ALLOWED_IPS=127.0.0.1
# REQUIRED: generate at least 32 random characters with: openssl rand -hex 32
# Same value as Spring Boot backend/.env QBT_FILE_GATEWAY_SECRET.
QBT_FILE_GATEWAY_SECRET=CHANGE_ME_BEFORE_STARTING

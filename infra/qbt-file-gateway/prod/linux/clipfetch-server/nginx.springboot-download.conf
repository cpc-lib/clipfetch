# ClipFetch browser-download endpoint - Spring Boot Linux host.
# Install to: /usr/local/nginx/conf/snippets/clipfetch-download.conf
# Include INSIDE the existing website's server{} (do NOT load directly in http{}):
#     include /usr/local/nginx/conf/snippets/clipfetch-download.conf;
#
# Replace 127.0.0.1:8082 if Spring Boot runs on a different address/port.
# If Spring Boot is on Windows (and not behind Linux Nginx), this file is unnecessary.
location ^~ /api/magnet/downloads/stream/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    access_log off; # URL contains short-lived file ticket
    add_header Referrer-Policy no-referrer always;
}

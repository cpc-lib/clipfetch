# ClipFetch FTP/FTPS controlled test fixture (ProFTPD)
# Placeholders rendered by entrypoint.sh: @PASV_ADDRESS@ @PASV_MIN_PORT@ @PASV_MAX_PORT@
# TLS 与 Anonymous 段由 entrypoint.sh 按 SSL_ENABLE / ANON_ENABLE 追加

ServerName            "ClipFetch FTP fixture"
ServerType            standalone
DefaultServer         on
Port                  21
UseIPv6               off

# 容器内 root 启动；具名登录用户切换到其自身 uid
User                  ftp
Group                 nogroup

# 不依赖 PAM，使用 /etc/passwd + /etc/shadow（mod_auth_unix）
AuthPAM               off
RequireValidShell     off
UseReverseDNS         off
WtmpLog               off

# 所有登录用户锁定在数据目录（具名账号允许新建目录/上传/覆盖，匿名段在 entrypoint.sh 单独限制只读）
DefaultRoot           /srv/ftp/pub
Umask                 022

# 必需 DSO 模块（Debian 将传输/目录列表等核心能力编译为模块）
ModulePath            /usr/lib/proftpd
LoadModule            mod_delay.c
LoadModule            mod_ls.c
LoadModule            mod_xfer.c
LoadModule            mod_unique_id.c

AllowOverwrite        on

PassivePorts          @PASV_MIN_PORT@ @PASV_MAX_PORT@
MasqueradeAddress     @PASV_ADDRESS@

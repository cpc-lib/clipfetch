services:
  amule:
    image: ngosang/amule:3.2.0-1
    container_name: clipfetch-amule
    restart: unless-stopped
    environment:
      PUID: ${AMULE_PUID:-1000}
      PGID: ${AMULE_PGID:-1000}
      UMASK: 0002
      TZ: ${AMULE_TZ:-Asia/Shanghai}
      WEBUI_PWD: ${AMULE_API_PASSWORD:-clipfetch-amule-admin}
      GUI_PWD: ${AMULE_EC_PASSWORD:-clipfetch-amule-ec}
      WEBUI_ENABLED: "true"
      LEGACY_AMULEWEB_ENABLED: "false"
      TEMP_DIR: /downloads/temp
      INCOMING_DIR: /downloads/incoming
      MOD_AUTO_RESTART_ENABLED: "false"
      MOD_AUTO_SHARE_ENABLED: "false"
    ports:
      # 管理 API 仅绑定本机回环地址，严禁绑定 0.0.0.0；不暴露 EC 4712 端口
      - "127.0.0.1:${AMULE_API_HOST_PORT:-4711}:4711"
      # eD2k / Kad P2P 传输端口
      - "${AMULE_ED2K_TCP_PORT:-4662}:4662/tcp"
      - "${AMULE_ED2K_SERVER_UDP_PORT:-4665}:4665/udp"
      - "${AMULE_KAD_UDP_PORT:-4672}:4672/udp"
    volumes:
      - ${AMULE_CONFIG_ROOT:-./config}:/home/amule/.aMule
      - ${AMULE_DATA_ROOT:-../../downloads/ed2k}:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4711/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

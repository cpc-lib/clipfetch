syntax = "proto3";

package cc.ivera.magnet.engine.v1;

option java_package = "cc.ivera.magnet.engine.v1";

import "google/protobuf/timestamp.proto";

// libtorrent C++ Worker API（规格 §7.1）。
// 用户级授权一律由 Java 服务执行；Worker 仅在内网 mTLS / Unix socket 暴露。
// 所有命令携带 command_id / resource_id / owner_epoch / deadline，
// 用于去重与拒绝过期执行（规格 §5.3）。torrent_handle 是进程本地对象，
// 不作永久主键；会话可由 resource_id + resume data 重建。
service DownloadEngine {
  // 仅解析元数据（Magnet / .torrent），会话按 TTL 释放网络资源
  rpc ResolveMetadata(ResolveMetadataRequest) returns (ResolveMetadataResponse);
  // 挂载资源会话（可选 resume data 恢复）
  rpc AddTorrent(AddTorrentRequest) returns (AddTorrentResponse);
  // 全量下发活跃用户文件下标并集对应的优先级
  rpc UpdateFilePriorities(UpdateFilePrioritiesRequest) returns (UpdateFilePrioritiesResponse);
  rpc Pause(CommandRequest) returns (CommandResponse);
  rpc Resume(CommandRequest) returns (CommandResponse);
  // 低开销快照（总进度刷新）
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // 恢复快照：恢复提示，不是授权真相或已验证数据的永久凭证
  rpc SaveResumeData(SaveResumeDataRequest) returns (SaveResumeDataResponse);
  rpc RemoveTorrent(RemoveTorrentRequest) returns (CommandResponse);
  // alert 流：状态/进度/错误事件推送
  rpc StreamAlerts(AlertStreamRequest) returns (stream Alert);
  rpc Health(HealthRequest) returns (HealthResponse);
}

// 命令公共信封
message CommandEnvelope {
  string command_id = 1;   // 幂等键
  string resource_id = 2;  // 业务资源标识（非 torrent_handle）
  int64 owner_epoch = 3;   // 仅当前 epoch 的写入有效
  google.protobuf.Timestamp deadline = 4;
  google.protobuf.Timestamp lease_until = 5; // DB UTC 租约截止时间；命令不能延长此授权
}

message ResolveMetadataRequest {
  CommandEnvelope envelope = 1;
  bytes btih = 2;              // 20 字节 SHA-1，可空
  bytes btmh = 3;              // 32 字节 SHA-256 multihash 原值，可空
  repeated string trackers = 4;
  bytes torrent_file = 5;      // 直接提供 .torrent 字节时免于网络解析
}

message ResolveMetadataResponse {
  bool accepted = 1;
  string error = 2;
  bytes torrent_file = 3;      // 解析完成的 .torrent 元数据
}

message AddTorrentRequest {
  CommandEnvelope envelope = 1;
  bytes torrent_file = 2;
  bytes resume_data = 3;       // 可空
  // Java passes a path under the Worker download root; the Worker validates it before use.
  string storage_path = 4;
  bool metadata_only = 5;
  bytes btih = 6;              // torrent_file 为空时按哈希挂会话（DHT 抓元数据）
  bytes btmh = 7;
  repeated string trackers = 8;
}

message AddTorrentResponse {
  bool accepted = 1;
  string error = 2;
}

message UpdateFilePrioritiesRequest {
  CommandEnvelope envelope = 1;
  repeated int32 file_priorities = 2; // 与文件下标一一对应，0=不下载
}

message UpdateFilePrioritiesResponse {
  bool accepted = 1;
  string error = 2;
}

message CommandRequest {
  CommandEnvelope envelope = 1;
}

message CommandResponse {
  bool accepted = 1;
  string error = 2;
}

message GetSnapshotRequest {
  CommandEnvelope envelope = 1;
}

message GetSnapshotResponse {
  string state = 1;                 // DISCOVERING/METADATA_READY/ACTIVE/IDLE/RECOVERING/STOPPED/FAILED
  bool metadata_ready = 2;
  int64 verified_bytes = 3;
  int64 download_rate_bytes_per_sec = 4;
  int64 upload_rate_bytes_per_sec = 5;
  int32 peer_count = 6;
  repeated int64 file_verified_bytes = 7; // 每个 torrent 文件已通过 piece 校验的字节数
}

message SaveResumeDataRequest {
  CommandEnvelope envelope = 1;
}

message SaveResumeDataResponse {
  bytes resume_data = 1;
  int64 resume_version = 2;
  bool accepted = 3;
  string error = 4;
}

message RemoveTorrentRequest {
  CommandEnvelope envelope = 1;
  bool remove_unreferenced_data = 2;
}

message AlertStreamRequest {
  string resource_id = 1; // 空表示订阅全部
}

message Alert {
  string resource_id = 1;
  string type = 2;
  string message = 3;
  google.protobuf.Timestamp at = 4;
}

message HealthRequest {
}

message HealthResponse {
  bool ok = 1;
  string worker_id = 2;
  string libtorrent_version = 3;
}
